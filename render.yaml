# ═══════════════════════════════════════════════════════════════════
# render.yaml — Blueprint do Render para a API do Feira System
# Fica na RAIZ do repositório (ao lado das pastas backend/ e frontend/).
# No Render: New → Blueprint → escolha o repositório → Apply.
#
# Cria:
#   • feira-system-api  → Web Service Node (pasta backend/)
#   • feira-system-db   → PostgreSQL gerenciado
# As variáveis com "sync: false" o Render pergunta na hora do Apply
# (ficam só no painel, nunca no Git).
# ═══════════════════════════════════════════════════════════════════

services:
  - type: web
    name: feira-system-api
    runtime: node
    rootDir: backend
    region: virginia          # mesma região do banco (as duas precisam bater)
    plan: free                # "starter" não hiberna: sem atraso no 1º acesso
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY       # o Render fica na frente da API como proxy
        value: "1"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: TZ                # relógio do servidor no horário do Brasil (sem isto as vendas aparecem com 3h a menos)
        value: America/Sao_Paulo

      # Endereços públicos (troque pelo seu domínio)
      - key: FRONTEND_URL
        value: https://feira-system-app.netlify.app
      - key: LANDING_URL
        value: https://feira-system.netlify.app

      # Segredos
      - key: JWT_SECRET
        generateValue: true    # o Render gera uma string aleatória forte
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Banco: preenchido automaticamente a partir do Postgres abaixo
      - key: DB_HOST
        fromDatabase: { name: feira-system-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: feira-system-db, property: port }
      - key: DB_USER
        fromDatabase: { name: feira-system-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: feira-system-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: feira-system-db, property: database }

      # E-mail (recuperação de senha + aviso de leads).
      # O plano free do Render BLOQUEIA SMTP; por isso o envio é pela Gmail
      # API oficial (HTTPS), no mesmo projeto "feira-system" do Google Cloud
      # e com o mesmo cliente OAuth do login (GOOGLE_CLIENT_ID). Os dois
      # valores abaixo ficam só no painel do Render: a "Chave secreta do
      # cliente" (Google Auth Platform → Clientes) e o refresh token gerado
      # no OAuth Playground com o escopo gmail.send (passo a passo no guia).
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: SMTP_FROM
        value: "Feira System <otavioac01@gmail.com>"
      # Recebe um e-mail a cada contato novo do formulário da Landing Page
      - key: LEADS_NOTIFY_EMAIL
        value: otavioac01@gmail.com

      # Administradores (veem a tela "Contatos"). Vários: separe por vírgula.
      - key: ADMIN_EMAILS
        value: otavioac01@gmail.com

      - key: LEADS_WEBHOOK_URL
        sync: false
      - key: LEADS_WEBHOOK_TOKEN
        sync: false

databases:
  - name: feira-system-db
    databaseName: feira_system
    user: feira_system
    region: virginia
    plan: free                 # o Postgres free do Render expira após 30 dias; use "basic-256mb" em produção
    ipAllowList: []            # só serviços do próprio Render acessam; para rodar o schema.sql, libere seu IP no painel
