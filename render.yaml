# ═══════════════════════════════════════════════════════════════════
# render.yaml — Blueprint do Render para a API do Feira System
# Fica na RAIZ do repositório (ao lado das pastas backend/ e frontend/).
# No Render: New → Blueprint → escolha o repositório → Apply.
#
# Cria:
#   • feira-system-api  → Web Service Node (pasta backend/)
#   • feira-system-app  → Static Site com o sistema React (pasta frontend/)
#     ⭐ substitui o Netlify, que pausou as publicações quando os créditos
#     do plano gratuito acabaram.
# O banco PostgreSQL fica no Neon (neon.tech), fora do Render.
# As variáveis com "sync: false" o Render pergunta na hora do Apply
# (ficam só no painel, nunca no Git).
# ═══════════════════════════════════════════════════════════════════

services:
  - type: web
    name: feira-system-api
    runtime: node
    rootDir: backend
    region: virginia          # perto do banco no Neon (AWS US East 1 / Virginia)
    plan: free                # "starter" não hiberna: sem atraso no 1º acesso
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TRUST_PROXY       # o Render fica na frente da API como proxy
        value: "1"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: TZ                # relógio do servidor no horário do Brasil (sem isto as vendas aparecem com 3h a menos)
        value: America/Sao_Paulo

      # Endereços públicos (troque pelo seu domínio)
      # FRONTEND_URL aceita uma lista separada por vírgula: a PRIMEIRA é usada
      # nos links dos e-mails (recuperar senha); todas são liberadas no CORS.
      # O endereço antigo do Netlify continua liberado enquanto existir.
      - key: FRONTEND_URL
        value: https://feira-system-app.onrender.com,https://feira-system-app.netlify.app
      - key: LANDING_URL
        value: https://feira-system.netlify.app

      # Segredos
      - key: JWT_SECRET
        generateValue: true    # o Render gera uma string aleatória forte
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Banco: PostgreSQL no Neon (grátis, não expira). O valor é a
      # "connection string" DIRETA do Neon (com "Connection pooling"
      # desligado) e fica só no painel do Render, nunca no Git.
      - key: DATABASE_URL
        sync: false

      # E-mail (recuperação de senha + aviso de leads).
      # O plano free do Render BLOQUEIA SMTP; por isso o envio é pela Gmail
      # API oficial (HTTPS), no mesmo projeto "feira-system" do Google Cloud
      # e com o mesmo cliente OAuth do login (GOOGLE_CLIENT_ID). Os dois
      # valores abaixo ficam só no painel do Render: a "Chave secreta do
      # cliente" (Google Auth Platform → Clientes) e o refresh token gerado
      # no OAuth Playground com o escopo gmail.send (passo a passo no guia).
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: SMTP_FROM
        value: "Feira System <otavioac01@gmail.com>"
      # Cada "Fale conosco" da Landing Page chega por e-mail SÓ para o dono
      # do sistema (os feirantes não veem nada disso). "Responder" no e-mail
      # já vai direto para quem escreveu.
      - key: LEADS_NOTIFY_EMAIL
        value: otavioac01@gmail.com
      - key: LEADS_WEBHOOK_URL
        sync: false
      - key: LEADS_WEBHOOK_TOKEN
        sync: false

  # ═══ Sistema React (front-end) — Static Site grátis do Render ═══
  - type: web
    name: feira-system-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      # lidas NO BUILD pelo Vite
      - key: VITE_API_URL
        value: https://feira-system-api.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        value: 264198935201-66d1ktj0mbrj7ffl06vim59kb0b00fhg.apps.googleusercontent.com
      - key: NODE_VERSION
        value: "20"
    # SPA: qualquer rota (/login, /dashboard...) entrega o index.html.
    # Arquivos que existem de verdade (termos.html, privacidade.html,
    # /assets/...) continuam sendo servidos normalmente.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Mesmos cabeçalhos do public/_headers (o Render não lê esse arquivo)
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
